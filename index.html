        async function apiRequest(action, payload = {}) {
            if (!GAS_URL) return handleDemoLogic(action, payload);

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                });
                
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    throw new Error("Gagal terhubung ke Database Google Sheets.");
                }
            } catch (error) {
                showToast("Kesalahan Jaringan: " + error.message, 'error');
                throw error;
            }
        }

        async function handleDemoLogic(action, p) {
            await new Promise(r => setTimeout(r, 300));
            
            if (action === 'login') {
                for (const role in dummyDB) {
                    if (['kelas', 'kamar', 'kegiatan', 'pemetaan', 'presensi'].includes(role)) continue;
                    const user = dummyDB[role].find(u => (String(u.nik) === String(p.nik) || String(u.id) === String(p.nik)) && String(u.password) === String(p.password));
                    if (user) {
                        if(user.statusAkun !== 'Aktif') return { success: false, message: 'Akun non-aktif' };
                        return { success: true, user, role };
                    }
                }
                return { success: false, message: 'Kredensial salah atau tidak ditemukan' };
            }
            if (action === 'register') {
                const arr = dummyDB[p.role] || [];
                if (!dummyDB[p.role]) dummyDB[p.role] = arr;
                const prefix = p.role.charAt(0).toUpperCase();
                const id = `${prefix}2608${String(arr.length + 1).padStart(3, '0')}`;
                arr.push({ id, namaLengkap: p.data.namaLengkap, nik: p.data.nik, password: p.data.password, statusAkun: 'Non Aktif' });
                return { success: true };
            }
            if (action === 'get') {
                return { success: true, data: dummyDB[p.entity] || [] };
            }
            if (action === 'save') {
                const arr = dummyDB[p.entity];
                if (p.id) {
                    const idx = arr.findIndex(x => x.id === p.id);
                    if (idx > -1) arr[idx] = { ...arr[idx], ...p.data }; 
                } else {
                    let prefix = p.entity.charAt(0).toUpperCase();
                    if(p.entity === 'kelas') prefix = 'C';
                    if(p.entity === 'kamar') prefix = 'R';
                    if(p.entity === 'kegiatan') prefix = 'K';
                    p.data.id = `${prefix}2608${String(arr.length + 1).padStart(3, '0')}`;
                    if(!p.data.password && ['admin', 'guru', 'pengurus', 'santri'].includes(p.entity)) p.data.password = '123';
                    if(!p.data.statusAkun && ['admin', 'guru', 'pengurus', 'santri'].includes(p.entity)) p.data.statusAkun = 'Aktif';
                    arr.push(p.data);
                }
                return { success: true };
            }
            if (action === 'delete') {
                dummyDB[p.entity] = dummyDB[p.entity].filter(x => x.id !== p.id);
                return { success: true };
            }
            if (action === 'updateStatus') {
                const item = dummyDB[p.entity].find(x => x.id === p.id);
                if(item) item.statusAkun = p.status;
                return { success: true };
            }
            if (action === 'savePemetaan') {
                const items = Array.isArray(p.data) ? p.data : [p.data];
                items.forEach(item => {
                    dummyDB.pemetaan.forEach(row => {
                        if(row.idSantri === item.idSantri && row.tipe === item.tipe && row.status === 'Aktif') {
                            row.status = 'Riwayat';
                        }
                    });
                    dummyDB.pemetaan.push({
                        ...item,
                        id: `M2608${dummyDB.pemetaan.length + 1}`,
                        tanggal: new Date().toISOString().split('T')[0],
                        status: 'Aktif'
                    });
                });
                return { success: true };
            }
            if (action === 'savePresensi') {
                const items = Array.isArray(p.data) ? p.data : [p.data];
                items.forEach(item => {
                    dummyDB.presensi = dummyDB.presensi.filter(row => 
                        !(row.idSantri === item.idSantri && row.idKegiatan === item.idKegiatan && row.tanggal === item.tanggal)
                    );
                    dummyDB.presensi.push({
                        ...item,
                        id: `P2608${dummyDB.presensi.length + 1}`
                    });
                });
                return { success: true };
            }
        }

        async function login() {
            const id = document.getElementById('loginId').value;
            const pass = document.getElementById('loginPassword').value;
            if(!id || !pass) return showToast('Isi NIK/ID dan Password', 'warning');

            showLoading('Mencoba masuk...');
            const res = await apiRequest('login', { nik: id, password: pass });
            hideLoading();

            if (res.success) {
                showToast('Login berhasil!', 'success');
                sessionStorage.setItem('simUser', JSON.stringify(res.user));
                sessionStorage.setItem('simRole', res.role);
                checkSession();
            } else {
                showToast(res.message || 'Login gagal.', 'error');
            }
        }

        async function register() {
            const role = document.getElementById('regRole').value;
            const nama = document.getElementById('regName').value;
            const nik = document.getElementById('regNik').value;
            const password = document.getElementById('regPassword').value;

            if(!nama || !nik || !password) return showToast('Lengkapi semua data pendaftaran', 'warning');

            showLoading('Mendaftarkan akun...');
            const res = await apiRequest('register', { role, data: { namaLengkap: nama, nik, password } });
            hideLoading();

            if (res.success) {
                showToast('Registrasi berhasil! Menunggu aktivasi admin.', 'success');

            } else {
                showToast(res.message || 'Gagal mendaftar', 'error');
            }
        }

        function checkSession() {
            const u = sessionStorage.getItem('simUser');
            const r = sessionStorage.getItem('simRole');
            if (u && r) {
                sessionUser = JSON.parse(u);
                sessionRole = r;
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('displayUserName').innerText = sessionUser.namaLengkap || sessionUser.id;
                document.getElementById('displayUserRole').innerText = sessionRole;
                resetTimer();
                renderMenu();
                loadContent();
            } else {
                logout();
            }

            sessionStorage.removeItem('simUser');
            sessionStorage.removeItem('simRole');

            clearTimeout(inactivityTimer);

                if (tabBtnIndiv) {
                    tabBtnIndiv.classList.add('bg-white', 'text-emerald-800', 'shadow-sm');

                }
                if (tabBtnKolektif) {
                    tabBtnKolektif.classList.remove('bg-white', 'text-emerald-800', 'shadow-sm');
                    tabBtnKolektif.classList.add('text-gray-600');

                if (kolektifSection) kolektifSection.classList.remove('hidden');

        async function submitPemetaanSpesifik(tipeTarget) {
            const payload = {
                idSantri: document.getElementById('mapSantriId').value,
                namaSantri: document.getElementById('mapSantriName').value,
                tipe: document.getElementById('mapTipe').value,
                idTujuan: document.getElementById('mapTujuanId').value,
                namaTujuan: document.getElementById('mapTujuanName').value
            };
            if(!payload.idSantri || !payload.idTujuan) return showToast('Harap lengkapi pilihan santri dan tujuan', 'warning');

            showLoading(`Menyimpan Pemetaan...`);
            const res = await apiRequest('savePemetaan', { data: payload });
            hideLoading();
            if (res && res.success) {
                showToast('Pemetaan berhasil disimpan', 'success');
                renderPemetaanSpesifik(tipeTarget);
            }
        }

        async function submitPemetaanKolektif(tipeTarget) {
            const targetId = document.getElementById('mapTujuanIdKolektif')?.value;
            const targetName = document.getElementById('mapTujuanNameKolektif')?.value;
            const checkedCbs = Array.from(document.querySelectorAll('#kolektifSantriTable .santri-checkbox:checked'));

            if (!targetId) {
                return showToast(`Harap pilih ${tipeTarget} tujuan terlebih dahulu`, 'warning');
            }
            if (checkedCbs.length === 0) {
                return showToast('Harap centang minimal satu santri', 'warning');
            }

            const payloadList = checkedCbs.map(cb => ({
                idSantri: cb.value,
                namaSantri: cb.getAttribute('data-nama'),
                tipe: tipeTarget,
                idTujuan: targetId,
                namaTujuan: targetName
            }));

            showLoading(`Menyimpan Penempatan Kolektif (${payloadList.length} Santri)...`);
            const res = await apiRequest('savePemetaan', { data: payloadList });
            hideLoading();

            if (res && res.success) {
                showToast(`Penempatan kolektif ${payloadList.length} santri berhasil disimpan!`, 'success');
                renderPemetaanSpesifik(tipeTarget);
            }
        }

            });
        }

        function renderTable(data) {
            const thead = document.querySelector('#dataTable thead tr');
            const tbody = document.querySelector('#dataTable tbody');
            if(!thead || !tbody) return;
            thead.innerHTML = ''; tbody.innerHTML = '';
            
            if(!data || data.length === 0) {
                tbody.innerHTML = '<tr><td class="p-4 text-center text-gray-500" colspan="100%">Tidak ada data</td></tr>';
                return;
            }

            const isReadOnly = !['admin', 'pengurus'].includes(sessionRole);
            let displayCols = [{ key: 'id', label: 'ID' }, { key: 'namaLengkap', label: 'Nama Lengkap' }, { key: 'jenisKelamin', label: 'Jenis Kelamin' }];

            if(currentEntity === 'kelas') displayCols = [{ key: 'id', label: 'ID' }, { key: 'namaKelas', label: 'Nama Kelas' }, { key: 'tingkat', label: 'Tingkat' }, { key: 'waliKelas', label: 'Wali Kelas' }, { key: 'kapasitas', label: 'Kapasitas' }];
            if(currentEntity === 'kamar') displayCols = [{ key: 'id', label: 'ID' }, { key: 'namaKamar', label: 'Nama Kamar' }, { key: 'gedung', label: 'Gedung' }, { key: 'pembina', label: 'Pembina' }, { key: 'kapasitas', label: 'Kapasitas' }];
            if(currentEntity === 'kegiatan') {
                displayCols = [
                    { key: 'id', label: 'ID' }, 
                    { key: 'namaKegiatan', label: 'Nama Kegiatan' }, 
                    { key: 'statusKeaktifan', label: 'Status Keaktifan' }
                ];
            }
            if(currentEntity === 'santri') {
                displayCols = [
                    { key: 'id', label: 'ID' }, 
                    { key: 'namaLengkap', label: 'Nama Lengkap' }, 
                    { key: 'jenisKelamin', label: 'L / P' },
                    { key: 'sambungDaerah', label: 'Daerah' },
                    { key: 'kelasVirtual', label: 'Kelas' },
                    { key: 'kamarVirtual', label: 'Kamar' }
                ];
            }

            thead.innerHTML += `<th class="p-3 text-center w-12 border-b whitespace-nowrap">No</th>`;
            displayCols.forEach(col => thead.innerHTML += `<th class="p-3 uppercase text-xs font-semibold border-b whitespace-nowrap">${col.label}</th>`);
            thead.innerHTML += `<th class="p-3 text-right border-b whitespace-nowrap">Aksi</th>`;

            data.forEach((row, index) => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 transition text-sm";
                tr.innerHTML += `<td class="p-3 text-center text-gray-500 whitespace-nowrap">${index + 1}</td>`;

                displayCols.forEach(col => {
                    let cellVal = row[col.key] !== undefined ? row[col.key] : '-';
                    
                    if(col.key === 'waliKelas' || col.key === 'pembina') {
                        let arr = [];
                        [1,2,3].forEach(n => {
                            let k = row[`${col.key}${n}`];
                            if(k) arr.push(`<span class="block">${n}. ${guruLookupMap[k] || k}</span>`);
                        });
                        cellVal = arr.length > 0 ? arr.join('') : '-';
                    } else if (col.key === 'statusKeaktifan') {
                        const isAktif = cellVal === 'Aktif';
                        cellVal = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isAktif ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${cellVal || 'Aktif'}</span>`;
                    }
                    
                    if (col.key === 'kelasVirtual' || col.key === 'kamarVirtual') {
                        cellVal = cellVal && cellVal !== '-' ? `<span class="font-medium text-emerald-700">${cellVal}</span>` : '<span class="text-xs text-gray-400 italic">Belum plot</span>';
                    }

                    tr.innerHTML += `<td class="p-3 whitespace-nowrap">${cellVal}</td>`;
                });

                let aksiHtml = `<td class="p-3 text-right space-x-2 whitespace-nowrap">
                    <button onclick="viewData('${row.id}')" class="text-emerald-600 hover:text-emerald-800" title="Lihat Detail"><i class="fas fa-eye"></i></button>`;
                
                if(!isReadOnly) {
                    aksiHtml += `
                        <button onclick="openFormModal('${row.id}')" class="text-green-500 hover:text-green-700" title="Edit"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteData('${row.id}')" class="text-red-500 hover:text-red-700" title="Hapus"><i class="fas fa-trash"></i></button>`;
                }
                
                aksiHtml += `</td>`;
                tr.innerHTML += aksiHtml;
                
                tbody.appendChild(tr);
            });
        }

                    const div = document.createElement('div');
                    let html = '';
                    const cls = "w-full border rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500";
                    if(f.type === 'select') html = `<select name="${f.name}" class="${cls}"><option value="">-- Pilih --</option>${f.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
                    else if(f.type === 'select_guru') html = `<select name="${f.name}" class="${cls}">${guruOpts}</select>`;
                    else html = `<input type="${f.type}" name="${f.name}" value="${val}" placeholder="${f.placeholder || ''}" class="${cls}" ${f.required ? 'required' : ''}>`;
                    div.innerHTML = `<label class="block text-xs font-bold text-gray-600 mb-1">${f.label}</label>${html}`;
                    grid.appendChild(div);
                });
            });

            if(id && ['kelas', 'kamar'].includes(currentEntity)) {
                setTimeout(() => { form.querySelectorAll('select').forEach(s => { if(itemData[s.name]) s.value = itemData[s.name]; }); }, 50);
            }
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

        async function submitForm() {
            const form = document.getElementById('crudForm');
            if(!form.checkValidity()) { form.reportValidity(); return; }
            const formData = new FormData(form);
            let dataObj = {};
            formData.forEach((v, k) => { dataObj[k] = v; });
            if(dataObj.password === "") delete dataObj.password;

            showLoading();
            await apiRequest('save', { entity: currentEntity, id: currentEditId, data: dataObj });
            hideLoading();
            closeFormModal();
            loadContent();
        }

        async function deleteData(id) {
            const confirmed = await showConfirm('Hapus Data Permanen', 'Apakah Anda yakin ingin menghapus data ini secara permanen? Data yang dihapus tidak dapat dikembalikan.');
            if(!confirmed) return;

            showLoading('Menghapus data...');
            await apiRequest('delete', { entity: currentEntity, id });
            hideLoading();
            loadContent();
        }

        function showLoading(text = 'Memproses...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

        function showConfirm(title, message) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            return new Promise((resolve) => {
                confirmResolver = resolve;
            });
        }

        function closeConfirm(result) {
            document.getElementById('confirmModal').classList.add('hidden');
            if(confirmResolver) {
                confirmResolver(result);
                confirmResolver = null;
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('notificationContainer');
            if(!container) return;
            const t = document.createElement('div');
            t.className = `${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-green-600'} text-white px-5 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center transition-all duration-300`;
            t.innerHTML = `<span class="mr-2">ℹ️</span> ${msg}`;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        function viewData(id) {
            const itemData = (globalDataCache[currentEntity] || []).find(x => x.id === id);
            if(!itemData) return showToast('Data tidak ditemukan', 'error');

            const body = document.getElementById('detailBody');
            body.innerHTML = '';

            const schemas = entitySchemas[currentEntity] || [];
            
            schemas.forEach(group => {
                const gDiv = document.createElement('div');
                gDiv.className = "bg-white border rounded-xl p-5 mb-6 shadow-sm";
                gDiv.innerHTML = `<h4 class="font-bold text-emerald-800 mb-4 border-b pb-2"><i class="${group.icon} mr-2"></i> ${group.title}</h4><div class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>`;
                body.appendChild(gDiv);
                
                const grid = gDiv.querySelector('div');
                group.fields.forEach(f => {
                    if (f.type === 'password') return;
                    
                    let val = itemData[f.name];
                    if (!val && val !== 0) val = '-';
                    
                    if (f.type === 'select_guru' && val !== '-') {
                        val = guruLookupMap[val] || val;
                    }
                    
                    const div = document.createElement('div');
                    div.innerHTML = `<p class="text-xs font-bold text-gray-500 uppercase">${f.label}</p><p class="text-sm font-medium text-gray-900 mt-1">${val}</p>`;
                    grid.appendChild(div);
                });
            });
            
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // ==========================================
        // MODUL PRESENSI KEGIATAN SANTRI
        // ==========================================

        async function renderPresensi() {
            showLoading('Memuat Modul Presensi...');
            await fetchAndCache('kegiatan');
            await fetchAndCache('santri');
            await fetchAndCache('kelas');
            await fetchAndCache('kamar');
            await fetchAndCache('pemetaan');
            await fetchAndCache('presensi');
            hideLoading();

            const kegiatanList = (globalDataCache['kegiatan'] || []).filter(k => k.statusKeaktifan === 'Aktif');
            let kegiatanOpts = '<option value="">-- Pilih Kegiatan --</option>';
            kegiatanList.forEach(k => {
                kegiatanOpts += `<option value="${k.id}">${k.namaKegiatan}</option>`;
            });

            const today = new Date().toISOString().split('T')[0];

            document.getElementById('mainContent').innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 mb-6">
                    <h3 class="text-xl font-bold text-emerald-800 flex items-center mb-6">
                        <i class="fas fa-clipboard-list mr-2"></i> Input Presensi Kegiatan Santri
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-5 rounded-xl border border-gray-200">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Tanggal Kegiatan <span class="text-red-500">*</span></label>
                            <input type="date" id="presensiTanggal" value="${today}" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Pilih Kegiatan <span class="text-red-500">*</span></label>
                            <select id="presensiKegiatan" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500" required>
                                ${kegiatanOpts}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Presensi Berdasar <span class="text-red-500">*</span></label>
                            <select id="presensiGroupType" onchange="onPresensiGroupTypeChange(this.value)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500 font-semibold text-emerald-800" required>
                                <option value="Kelas">Kelas</option>
                                <option value="Kamar">Kamar</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1" id="labelPresensiTarget">Pilih Kelas <span class="text-red-500">*</span></label>
                            <select id="presensiTargetId" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500" required>
                                <option value="">-- Pilih --</option>
                            </select>
                        </div>
                        <div class="md:col-span-4 flex justify-end">
                            <button type="button" onclick="loadFormPresensi()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-lg shadow transition flex items-center">
                                <i class="fas fa-search mr-2"></i> Tampilkan Form Presensi
                            </button>
                        </div>
                    </div>

                    <div id="presensiFormContainer" class="hidden">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                            <div>
                                <h4 class="font-bold text-emerald-900 text-base" id="presensiTargetTitle">Daftar Kehadiran Santri</h4>
                                <p class="text-xs text-emerald-700" id="presensiTargetSubtitle">Lakukan pengisian status kehadiran santri di bawah ini.</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-bold text-gray-600">Quick Set:</span>
                                <button type="button" onclick="quickSetPresensi('Hadir')" class="px-2.5 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs font-bold transition">Semua Hadir</button>
                                <button type="button" onclick="quickSetPresensi('Izin')" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-bold transition">Semua Izin</button>
                                <button type="button" onclick="quickSetPresensi('Sakit')" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-bold transition">Semua Sakit</button>
                                <button type="button" onclick="quickSetPresensi('Alpa')" class="px-2.5 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold transition">Semua Alpa</button>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-4">
                            <div class="relative w-full sm:w-64">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fas fa-search text-gray-400"></i></span>
                                <input type="text" id="presensiSearch" onkeyup="filterPresensiSantri()" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="Cari santri...">
                            </div>
                        </div>
                        
                        <div class="border rounded-lg overflow-hidden max-h-[500px] overflow-y-auto shadow-inner mb-6">
                            <table class="w-full text-left" id="presensiTable">
                                <thead class="bg-gray-100 border-b text-xs uppercase font-semibold text-gray-600 sticky top-0 z-10">
                                    <tr>
                                        <th class="p-3 text-center w-12 whitespace-nowrap">No</th>
                                        <th class="p-3 whitespace-nowrap">ID Santri</th>
                                        <th class="p-3 whitespace-nowrap">Nama Santri</th>
                                        <th class="p-3 whitespace-nowrap text-center">Status Kehadiran</th>
                                        <th class="p-3 whitespace-nowrap">Keterangan</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 bg-white text-sm" id="presensiTableBody">
                                </tbody>
                            </table>
                        </div>

                        <div class="flex justify-end">
                            <button type="button" onclick="saveBatchPresensi()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition flex items-center text-base">
                                <i class="fas fa-save mr-2"></i> Simpan Semua Presensi
                            </button>
                        </div>
                    </div>
                </div>
            `;

            onPresensiGroupTypeChange('Kelas');
        }

        function onPresensiGroupTypeChange(type) {
            const labelEl = document.getElementById('labelPresensiTarget');
            const selectEl = document.getElementById('presensiTargetId');
            if(!labelEl || !selectEl) return;

            labelEl.innerHTML = `Pilih ${type} <span class="text-red-500">*</span>`;
            selectEl.innerHTML = `<option value="">-- Pilih ${type} --</option>`;

            let list = globalDataCache[type.toLowerCase()] || [];

            // Jika login sebagai GURU, saring kelas/kamar yang diampu akun guru ini
            if (sessionRole === 'guru') {
                const gId = sessionUser.id;
                list = list.filter(item => {
                    if (type === 'Kelas') {
                        return item.waliKelas1 === gId || item.waliKelas2 === gId || item.waliKelas3 === gId;
                    } else if (type === 'Kamar') {
                        return item.pembina1 === gId || item.pembina2 === gId || item.pembina3 === gId;
                    }
                    return false;
                });
            }

            if (list.length === 0) {
                selectEl.innerHTML = `<option value="">-- Tidak ada ${type} yang diampu --</option>`;
                return;
            }

            list.forEach(item => {
                const name = type === 'Kelas' ? item.namaKelas : item.namaKamar;
                const info = type === 'Kelas' ? ` (Tingkat: ${item.tingkat||'-'})` : ` (${item.gedung||'-'})`;
                selectEl.innerHTML += `<option value="${item.id}" data-nama="${name}">${name}${info}</option>`;
            });
        }

        let loadedPresensiSantriList = [];

        async function loadFormPresensi() {
            const tgl = document.getElementById('presensiTanggal').value;
            const kegId = document.getElementById('presensiKegiatan').value;
            const groupType = document.getElementById('presensiGroupType').value;
            const targetSel = document.getElementById('presensiTargetId');
            const targetId = targetSel.value;
            const targetName = targetSel.options[targetSel.selectedIndex]?.getAttribute('data-nama') || '';

            if(!tgl || !kegId || !targetId) {
                return showToast('Lengkapi tanggal, kegiatan, dan kelas/kamar tujuan!', 'warning');
            }

            showLoading('Memuat Santri & Data Presensi...');
            await fetchAndCache('pemetaan');
            await fetchAndCache('santri');
            await fetchAndCache('presensi');
            hideLoading();

            const pemetaanData = globalDataCache['pemetaan'] || [];
            const allSantri = globalDataCache['santri'] || [];
            const presensiData = globalDataCache['presensi'] || [];

            // Filter santri aktif yang dipetakan ke targetId (Kelas/Kamar) yang dipilih
            const mappedSantriIds = pemetaanData
                .filter(p => p.tipe === groupType && p.idTujuan === targetId && p.status === 'Aktif')
                .map(p => p.idSantri);

            loadedPresensiSantriList = allSantri.filter(s => mappedSantriIds.includes(s.id) && s.statusAkun === 'Aktif');

            const container = document.getElementById('presensiFormContainer');
            const tbody = document.getElementById('presensiTableBody');
            
            if (loadedPresensiSantriList.length === 0) {
                container.classList.remove('hidden');
                document.getElementById('presensiTargetTitle').innerText = `Presensi ${groupType}: ${targetName}`;
                document.getElementById('presensiTargetSubtitle').innerText = `Tanggal: ${tgl}`;
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-amber-600 font-semibold"><i class="fas fa-exclamation-circle mr-2"></i>Tidak ada santri yang terdaftar di ${groupType} ini.</td></tr>`;
                return;
            }

            document.getElementById('presensiTargetTitle').innerText = `Presensi ${groupType}: ${targetName} (${loadedPresensiSantriList.length} Santri)`;
            document.getElementById('presensiTargetSubtitle').innerText = `Tanggal: ${tgl}`;

            tbody.innerHTML = '';
            loadedPresensiSantriList.forEach((santri, index) => {
                // Cari data presensi existing jika sudah pernah diisi
                const existing = presensiData.find(p => p.idSantri === santri.id && p.idKegiatan === kegId && p.tanggal === tgl);
                const currentStatus = existing ? existing.statusKehadiran : 'Hadir'; // Default Hadir
                const currentKet = existing ? (existing.keterangan || '') : '';

                let tr = document.createElement('tr');
                tr.className = 'presensi-row hover:bg-gray-50 transition border-b';
                tr.setAttribute('data-search', `${santri.namaLengkap} ${santri.id}`.toLowerCase());
                tr.innerHTML = `
                    <td class="p-3 text-center text-gray-500 font-medium whitespace-nowrap">${index + 1}</td>
                    <td class="p-3 font-mono text-xs text-gray-500 whitespace-nowrap">${santri.id}</td>
                    <td class="p-3 font-medium text-gray-800 whitespace-nowrap">${santri.namaLengkap}</td>
                    <td class="p-3 whitespace-nowrap">
                        <div class="flex items-center justify-center space-x-3">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="pres_${santri.id}" value="Hadir" ${currentStatus === 'Hadir' ? 'checked' : ''} class="text-green-600 focus:ring-green-500">
                                <span class="ml-1 text-xs font-semibold text-green-700">Hadir</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="pres_${santri.id}" value="Izin" ${currentStatus === 'Izin' ? 'checked' : ''} class="text-blue-600 focus:ring-blue-500">
                                <span class="ml-1 text-xs font-semibold text-blue-700">Izin</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="pres_${santri.id}" value="Sakit" ${currentStatus === 'Sakit' ? 'checked' : ''} class="text-amber-600 focus:ring-amber-500">
                                <span class="ml-1 text-xs font-semibold text-amber-700">Sakit</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="radio" name="pres_${santri.id}" value="Alpa" ${currentStatus === 'Alpa' ? 'checked' : ''} class="text-red-600 focus:ring-red-500">
                                <span class="ml-1 text-xs font-semibold text-red-700">Alpa</span>
                            </label>
                        </div>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                        <input type="text" id="ket_${santri.id}" value="${currentKet}" class="w-full border border-gray-300 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-emerald-500" placeholder="Catatan (opsional)...">
                    </td>
                `;
                tbody.appendChild(tr);
            });

            container.classList.remove('hidden');
        }

        function filterPresensiSantri() {
            const term = (document.getElementById('presensiSearch')?.value || '').toLowerCase();
            const rows = document.querySelectorAll('#presensiTableBody tr.presensi-row');
            rows.forEach(row => {
                const text = row.getAttribute('data-search') || '';
                row.style.display = text.includes(term) ? '' : 'none';
            });
        }

        function quickSetPresensi(status) {
            loadedPresensiSantriList.forEach(santri => {
                const radio = document.querySelector(`input[name="pres_${santri.id}"][value="${status}"]`);
                if(radio) radio.checked = true;
            });
        }

        async function saveBatchPresensi() {
            const tgl = document.getElementById('presensiTanggal').value;
            const kegId = document.getElementById('presensiKegiatan').value;
            const groupType = document.getElementById('presensiGroupType').value;
            const targetSel = document.getElementById('presensiTargetId');
            const targetId = targetSel.value;
            const targetName = targetSel.options[targetSel.selectedIndex]?.getAttribute('data-nama') || '';

            if (loadedPresensiSantriList.length === 0) {
                return showToast('Tidak ada data santri untuk disimpan', 'warning');
            }

            const payloadList = loadedPresensiSantriList.map(santri => {
                const selectedRadio = document.querySelector(`input[name="pres_${santri.id}"]:checked`);
                const status = selectedRadio ? selectedRadio.value : 'Hadir';
                const ket = document.getElementById(`ket_${santri.id}`)?.value || '';

                return {
                    idKegiatan: kegId,
                    tanggal: tgl,
                    idSantri: santri.id,
                    namaSantri: santri.namaLengkap,
                    statusKehadiran: status,
                    keterangan: ket,
                    tipeGroup: groupType,
                    idGroup: targetId,
                    namaGroup: targetName
                };
            });

            showLoading(`Menyimpan Presensi ${payloadList.length} Santri...`);
            const res = await apiRequest('savePresensi', { data: payloadList });
            hideLoading();

            if (res && res.success) {
                showToast(`Berhasil menyimpan presensi ${payloadList.length} santri!`, 'success');
                fetchAndCache('presensi');
            } else {
                showToast(res.message || 'Gagal menyimpan presensi', 'error');
            }
        }
    </script>
</body>
</html>
